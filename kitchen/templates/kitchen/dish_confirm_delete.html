<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Видалити страву</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Видалити страву</h1>
    <p>Ви впевнені, що хочете видалити страву: <strong>{{ object.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <a href="{% url 'dish_list' %}" class="btn btn-secondary">Скасувати</a>
        <button type="submit" class="btn btn-danger">Видалити</button>
    </form>
</body>
</html>
