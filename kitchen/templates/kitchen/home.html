{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Kitchen Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("{% static 'kitchen/images/fon.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .overlay {
            padding: 50px;
            border-radius: 20px;
            text-align: center;
        }
        .overlay h1 {
            color: #fff;
            margin-bottom: 30px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.7);
        }
        .overlay a {
            min-width: 220px;
            padding: 15px 0;
            font-size: 1.25rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .overlay a:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            transform: scale(1.05);
        }
        .overlay .d-flex {
            flex-direction: column;
            gap: 20px;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Kitchen Service</h1>
        <div class="d-flex">
            <a href="{% url 'dish_list' %}" class="btn">Перейти до страв</a>
            <a href="{% url 'cook_list' %}" class="btn">Перейти до кухарів</a>
        </div>
    </div>
</body>
</html>
